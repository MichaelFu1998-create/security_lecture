{% extends "base.html" %}
{% block title %}{{ user['username'] }}{% endblock %}
{% block content %}
  <div class="target">
    <span class="tag">RECORD</span>
    <h1>{{ user['username'] }}</h1>
  </div>

  <div class="record">
    <div><span class="k">uid</span><span class="v">{{ user['id'] }}</span></div>
    <div><span class="k">email</span><span class="v">{{ user['email'] }}</span></div>
    <div><span class="k">bio</span><span class="v">{{ user['bio'] }}</span></div>
  </div>

  {% if me and me['id'] == user['id'] %}
    <h2 class="sect">// change email</h2>
    <form method="POST" action="{{ url_for('change_email') }}" class="stack">
      <input name="new_email" placeholder="new@email.com" required>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">&gt; update</button>
    </form>
  {% endif %}
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VulnLab — {% block title %}{% endblock %}</title>
  <style>
    *{ box-sizing:border-box; }
    :root{
      --bg:#080b08; --panel:#0b110b; --panel2:#0e150e; --panel3:#0a0f0a;
      --fg:#b8f5be; --dim:#5f8f66; --accent:#39ff14; --link:#3be6ff;
      --border:#173217;
      /* default (home / neutral) accent */
      --state:#39ff14; --glow:rgba(57,255,20,.30);
    }
    body.vuln   { --state:#ff4747; --glow:rgba(255,71,71,.50); }
    body.secure { --state:#2bff88; --glow:rgba(43,255,136,.45); }

    html,body{ margin:0; }
    body{
      background:radial-gradient(1200px 600px at 50% -10%, rgba(57,255,20,.06), transparent 60%), var(--bg);
      color:var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace;
      font-size:15px; line-height:1.55; min-height:100vh; padding:1.4rem 1rem;
    }
    .scanlines{ position:fixed; inset:0; pointer-events:none; z-index:60;
      background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px);
      mix-blend-mode:multiply; opacity:.32; }

    .terminal{ max-width:1000px; margin:0 auto; background:var(--panel);
      border:1px solid var(--border); border-radius:10px; overflow:hidden;
      box-shadow:0 0 0 1px rgba(57,255,20,.05), 0 0 42px var(--glow), inset 0 0 70px rgba(0,0,0,.55); }
    .titlebar{ display:flex; align-items:center; gap:.6rem; padding:.55rem .85rem;
      background:linear-gradient(var(--panel2),var(--panel)); border-bottom:1px solid var(--border);
      font-size:.78rem; letter-spacing:.09em; color:var(--dim); }
    .dots{ display:flex; gap:.35rem; }
    .dots i{ width:11px; height:11px; border-radius:50%; display:block; }
    .dots i:nth-child(1){ background:#ff5f56; } .dots i:nth-child(2){ background:#ffbd2e; } .dots i:nth-child(3){ background:#27c93f; }
    .tt{ color:var(--accent); text-shadow:0 0 8px rgba(57,255,20,.5); }
    .tt-right{ margin-left:auto; color:var(--state); text-shadow:0 0 10px var(--glow); font-weight:700; }

    .shell{ display:flex; min-height:520px; }
    .sidebar{ width:220px; flex:none; border-right:1px solid var(--border); padding:.8rem .6rem; background:var(--panel3); }
    .sidebar .grp{ color:var(--dim); font-size:.68rem; letter-spacing:.16em; margin:.3rem .4rem .5rem; }
    .sidebar a{ display:block; color:var(--fg); text-decoration:none; padding:.42rem .55rem; border-radius:6px;
      border-left:2px solid transparent; margin-bottom:.15rem; font-size:.9rem; }
    .sidebar a .n{ color:var(--dim); margin-right:.4rem; }
    .sidebar a:hover{ background:rgba(59,230,255,.07); color:#fff; }
    .sidebar a.active{ border-left-color:var(--state); background:rgba(0,0,0,.35); color:#eaffe8;
      text-shadow:0 0 10px var(--glow); }

    main{ flex:1; padding:1rem 1.2rem 1.4rem; min-width:0; }
    h1{ font-size:1.35rem; margin:.2rem 0 .1rem; color:#eaffe8; text-shadow:0 0 14px var(--glow); }
    .sub{ color:var(--dim); font-size:.85rem; margin-bottom:1rem; }
    h2{ font-size:.98rem; color:var(--accent); letter-spacing:.04em; margin:1.4rem 0 .5rem; }

    .explain{ border:1px solid var(--border); border-left:3px solid var(--link); background:var(--panel3);
      border-radius:6px; padding:.7rem .85rem; color:var(--fg); }
    .explain b{ color:var(--link); }
    .panel{ border:1px solid var(--border); background:var(--panel3); border-radius:6px; padding:.8rem .85rem; margin:.5rem 0; }
    .reveal{ border:1px solid var(--border); border-left:3px solid var(--state); background:#05080a;
      border-radius:6px; padding:.7rem .85rem; margin:.5rem 0; }
    .fix{ border:1px solid var(--border); border-left:3px solid #2bff88; background:rgba(43,255,136,.05);
      border-radius:6px; padding:.7rem .85rem; margin:.5rem 0; color:#cfeacd; }

    pre{ margin:.3rem 0; padding:.6rem .7rem; background:#02120280; border:1px solid var(--border);
      border-radius:6px; overflow-x:auto; white-space:pre-wrap; word-break:break-word; }
    code{ background:rgba(2,18,2,.55); color:var(--accent); border:1px solid var(--border); padding:.03rem .3rem; border-radius:4px; }
    pre code{ border:none; background:none; padding:0; color:var(--fg); }
    .hl{ color:#ff8f8f; background:rgba(255,71,71,.13); padding:0 .1rem; border-radius:3px; }

    label{ color:var(--dim); font-size:.85rem; }
    input,textarea,select{ width:100%; max-width:460px; background:rgba(3,8,3,.6); color:var(--fg);
      border:1px solid var(--border); border-radius:6px; padding:.45rem .55rem; font:inherit; caret-color:var(--accent); }
    textarea{ min-height:64px; resize:vertical; }
    input:focus,textarea:focus,select:focus{ outline:none; border-color:var(--accent);
      box-shadow:0 0 0 1px var(--accent), 0 0 12px var(--glow); }
    ::placeholder{ color:#3f5f45; }
    .stack{ display:flex; flex-direction:column; gap:.55rem; align-items:flex-start; margin:.5rem 0; }
    .row{ display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }

    button, .btn{ background:transparent; color:var(--accent); border:1px solid var(--accent); border-radius:6px;
      padding:.4rem .8rem; font:inherit; cursor:pointer; text-decoration:none; display:inline-block;
      text-shadow:0 0 8px var(--glow); transition:.15s; }
    button:hover, .btn:hover{ background:var(--accent); color:#03110a; box-shadow:0 0 16px var(--glow); }
    .btn.ghost{ color:var(--link); border-color:var(--border); text-shadow:none; }
    .btn.ghost:hover{ background:rgba(59,230,255,.1); color:#fff; box-shadow:none; }
    .btn.danger{ color:#ff8f8f; border-color:#ff8f8f; }
    .btn.danger:hover{ background:#ff8f8f; color:#1a0505; }

    /* mode toggle */
    .toggle{ display:inline-flex; align-items:center; gap:.35rem; border:1px solid var(--border);
      border-radius:8px; padding:.2rem; background:var(--panel3); }
    .toggle .lbl{ color:var(--dim); font-size:.72rem; padding:0 .4rem; letter-spacing:.08em; }
    .seg{ text-decoration:none; color:var(--dim); padding:.28rem .7rem; border-radius:6px; font-size:.85rem; }
    .seg.on{ color:#03110a; font-weight:700; }
    .seg.vuln.on{ background:#ff6b6b; }
    .seg.secure.on{ background:#2bff88; }

    .result{ border-radius:6px; padding:.55rem .75rem; margin:.5rem 0; border:1px solid var(--border); }
    .result.ok{ border-left:3px solid #ff6b6b; background:rgba(255,71,71,.08); color:#ffd7d7; }
    .result.bad{ border-left:3px solid #2bff88; background:rgba(43,255,136,.08); color:#d6ffe6; }
    .result.win{ border-left:3px solid #2bff88; background:rgba(43,255,136,.08); color:#d6ffe6; }

    .attacker{ border:1px solid #7a2b2b; border-left:3px solid #ff6b6b; background:#160808; border-radius:6px;
      padding:.7rem .85rem; margin:.5rem 0; }
    .attacker .cap{ color:#ff9b9b; font-size:.72rem; letter-spacing:.14em; }
    .attacker .loot{ color:#ffd7d7; word-break:break-all; }

    .comment{ border:1px solid var(--border); border-left:3px solid var(--link); background:var(--panel3);
      border-radius:6px; padding:.5rem .65rem; margin:.45rem 0; }
    .comment .who{ font-weight:700; color:var(--link); }
    .comment .t{ color:var(--dim); font-size:.76em; margin-left:.4rem; }
    .comment .b{ margin-top:.3rem; white-space:pre-wrap; word-break:break-word; }

    .cards{ display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-top:1rem; }
    .card{ display:block; text-decoration:none; border:1px solid var(--border); border-radius:8px; padding:.8rem .9rem;
      background:var(--panel3); color:var(--fg); }
    .card:hover{ border-color:var(--accent); box-shadow:0 0 16px var(--glow); }
    .card .n{ color:var(--dim); font-size:.72rem; letter-spacing:.14em; }
    .card .h{ color:#eaffe8; font-size:1rem; margin:.15rem 0; }
    .card .d{ color:var(--dim); font-size:.82rem; }

    @media (prefers-reduced-motion: reduce){ .scanlines{ display:none; } }
    @media (max-width:720px){ .shell{ flex-direction:column; } .sidebar{ width:auto; border-right:none; border-bottom:1px solid var(--border);} .cards{ grid-template-columns:1fr; } }
  </style>
</head>
<body class="{{ mode }}">
  <div class="scanlines" aria-hidden="true"></div>
  <div class="terminal">
    <div class="titlebar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="tt">VULNLAB // WEB SECURITY</span>
      {% if mode %}<span class="tt-right">{{ 'SECURE' if mode == 'secure' else 'VULNERABLE' }}</span>{% endif %}
    </div>
    <div class="shell">
      <nav class="sidebar">
        <div class="grp">LAB</div>
        <a href="{{ url_for('home') }}" class="{{ 'active' if section == 'home' else '' }}">◆ Home</a>
        <div class="grp">VULNERABILITIES</div>
        {% for sid, label, slug in SECTIONS %}
          <a href="/{{ slug }}" class="{{ 'active' if section == sid else '' }}"><span class="n">{{ loop.index }}</span>{{ label }}</a>
        {% endfor %}
      </nav>
      <main>{% block content %}{% endblock %}</main>
    </div>
  </div>
</body>
</html>
